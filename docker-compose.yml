  redis:
    image: redis:7-alpine
    container_name: vote-rutherford-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: vote-rutherford-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      # Scripted image expects OSM PBFs / tiles under /custom_files
      - ./valhalla_data:/custom_files
    environment:
      # Local tennessee-*.osm.pbf in valhalla_data/ is used on first start.
      # After tiles exist, reuse them instead of rebuilding from the PBF.
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - serve_tiles=True
      - build_admins=True
      - build_time_zones=True
      - build_elevation=False
      - build_tar=True
      # Cap threads so tile builds don't OOM on a laptop (Tennessee extract is large).
      - server_threads=2

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    container_name: vote-rutherford-vroom
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - VROOM_ROUTER=valhalla
    volumes:
      - ./vroom_conf:/conf
    depends_on:
      - valhalla

volumes:
  postgres_data:
